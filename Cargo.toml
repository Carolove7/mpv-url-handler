[package]
name = "mpv-url-handler"
version = "1.0.0"
edition = "2021"
authors = ["Carolove7"]
description = "High-performance, zero-window-flash MPV URL Protocol Handler for Windows written in Rust"
license = "MIT"

[[bin]]
name = "mpv-handler"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true