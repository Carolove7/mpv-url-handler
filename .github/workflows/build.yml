name: Build and Release

on:
  push:
    branches:
      - main
      - rust-rewrite
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/mpv-handler.exe dist/
          Copy-Item install.bat dist/
          Copy-Item uninstall.bat dist/
          Copy-Item test.bat dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath mpv-url-handler-windows-x86_64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-url-handler-windows-x86_64
          path: mpv-url-handler-windows-x86_64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mpv-url-handler-windows-x86_64.zip
          generate_release_notes: true